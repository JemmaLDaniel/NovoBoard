[project]
name = "novoboard"
version = "0.1.0"
description = "Framework for evaluating de novo peptide sequencing"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.86",
    "gdown>=5.0",
    "matchms>=0.31.0",
    "matplotlib>=3.8",
    "matplotlib-venn>=1.1.2",
    "numpy>=1.24",
    "pandas>=2.2.3",
    "polars>=1.38.0",
    "seaborn>=0.13.2",
]

[project.scripts]
novoboard = "novoboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novoboard"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff.lint]
# Strict linting by default, with per-file exceptions for notebooks and shims
per-file-ignores = {"aa.fdr_github.ipynb" = ["E701", "E702", "E741", "F841"], "config.py" = ["F403", "F405"]}
